<title>Pipeline de Liquidez · Kabal</title>
<meta name="description" content="Funnel de proveedores de liquidez para el KTFT, emisiones B2B y líneas de Kabal Lending">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Paleta oficial Kabal — teal #075259 · lime #6FD904 · oscuro #141E26 (misma base que Pipeline RWA) */
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --surface-2:#FFFFFF; --panel:#E3EAE9;
  --ink:#141E26; --ink-2:#3C4A50; --muted:#6E7C7E; --line:#DBE3E2; --line-2:#C6D1CF;
  --accent:#075259; --accent-ink:#053C41; --accent-bg:#DDEBEA; --on-accent:#FFFFFF;
  --lime:#6FD904; --lime-ink:#3E7A00;
  --gold:#3E7A00; --gold-bg:#E8F2D6;
  --go:#3E7A00; --go-bg:#E7F2D6; --explore:#8A6314; --explore-bg:#F3EAD5; --drop:#A5493C; --drop-bg:#F2E3DE;
  --warn:#8A6314; --warn-bg:#F3EAD5; --crit:#A5493C; --crit-bg:#F2E3DE; --ok:#3E7A00; --ok-bg:#E7F2D6;
  /* rampa ordinal teal validada (claro): identificado → wired */
  --st1:#7ebcb3; --st2:#6aa79f; --st3:#55938b; --st4:#417f77; --st5:#2d6b64; --st6:#175852; --st7:#00453e; --st8:#00302b;
  --st-nurture:#7E8CA0; --st-lost:#A85B5B;
  --shadow:0 1px 2px rgba(20,30,38,.06),0 8px 24px -12px rgba(20,30,38,.16);
  --shadow-lg:0 24px 60px -20px rgba(20,30,38,.30);
  --radius:10px;
  font-family:"Source Sans 3",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141E26; --surface:#1B2833; --surface-2:#223140; --panel:#182430;
    --ink:#E5EAE8; --ink-2:#AAB6B6; --muted:#7E8C8C; --line:#26333D; --line-2:#33454F;
    --accent:#4FB3A8; --accent-ink:#7FD8CD; --accent-bg:#123029; --on-accent:#06231F;
    --lime:#6FD904; --lime-ink:#9CE24B;
    --gold:#9CC461; --gold-bg:#20301A;
    --go:#9CC461; --go-bg:#1F3315; --explore:#D6A64E; --explore-bg:#2C2614; --drop:#D5786A; --drop-bg:#2E1C19;
    --warn:#D6A64E; --warn-bg:#2C2614; --crit:#D5786A; --crit-bg:#2E1C19; --ok:#9CC461; --ok-bg:#1F3315;
    --st1:#23625b; --st2:#38766e; --st3:#4c8981; --st4:#609d95; --st5:#74b2a9; --st6:#89c7be; --st7:#9edcd3; --st8:#b3f2e9;
    --st-nurture:#8C9BB0; --st-lost:#C97A7A;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px -14px rgba(0,0,0,.62);
    --shadow-lg:0 30px 70px -22px rgba(0,0,0,.78);
  }
}
:root[data-theme="dark"]{
  --bg:#141E26; --surface:#1B2833; --surface-2:#223140; --panel:#182430;
  --ink:#E5EAE8; --ink-2:#AAB6B6; --muted:#7E8C8C; --line:#26333D; --line-2:#33454F;
  --accent:#4FB3A8; --accent-ink:#7FD8CD; --accent-bg:#123029; --on-accent:#06231F;
  --lime:#6FD904; --lime-ink:#9CE24B;
  --gold:#9CC461; --gold-bg:#20301A;
  --go:#9CC461; --go-bg:#1F3315; --explore:#D6A64E; --explore-bg:#2C2614; --drop:#D5786A; --drop-bg:#2E1C19;
  --warn:#D6A64E; --warn-bg:#2C2614; --crit:#D5786A; --crit-bg:#2E1C19; --ok:#9CC461; --ok-bg:#1F3315;
  --st1:#23625b; --st2:#38766e; --st3:#4c8981; --st4:#609d95; --st5:#74b2a9; --st6:#89c7be; --st7:#9edcd3; --st8:#b3f2e9;
  --st-nurture:#8C9BB0; --st-lost:#C97A7A;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px -14px rgba(0,0,0,.62);
  --shadow-lg:0 30px 70px -22px rgba(0,0,0,.78);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-family:"Montserrat",system-ui,sans-serif;text-wrap:balance}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hidden{display:none!important}

/* ---- header ---- */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
@media (max-width:1280px){.src{display:none}}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .mark{width:34px;height:34px;border-radius:9px;flex:0 0 auto;position:relative;overflow:hidden;background:#075259;box-shadow:var(--shadow)}
.brand .mark::before,.brand .mark::after{content:"";position:absolute;bottom:8px;width:0;height:0}
.brand .mark::before{left:5px;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:13px solid #6FD904}
.brand .mark::after{right:5px;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:10px solid #A7E86B}
.brand h1{font-size:15px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.brand p{margin:1px 0 0;font-size:11px;color:var(--muted)}
.hspring{flex:1 1 auto}
.search{position:relative;flex:0 1 230px;min-width:150px}
.search input{width:100%;padding:8px 12px 8px 32px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);font-size:13px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px;flex-wrap:wrap}
.seg button{border:none;background:none;color:var(--ink-2);padding:6px 11px;border-radius:6px;font-size:12.5px;font-weight:600}
.seg button.on{background:var(--surface-2);color:var(--ink);box-shadow:var(--shadow)}
.ghost{border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);padding:8px 12px;border-radius:8px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
.ghost .badge{background:var(--accent);color:var(--on-accent);border-radius:20px;font-size:11px;padding:1px 7px;font-weight:700}
.ghost.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.ghost.primary:hover{color:var(--on-accent);filter:brightness(1.08)}
.icon-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center}
.icon-btn:hover{color:var(--accent);border-color:var(--accent)}
.src{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.src .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.src.live .dot{background:var(--lime);box-shadow:0 0 0 3px color-mix(in srgb,var(--lime) 25%,transparent)}

/* ---- notes ---- */
.wrap{padding:18px 20px 40px;max-width:1500px;margin:0 auto}
.note{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--explore);border-radius:10px;padding:11px 14px;margin-bottom:14px;font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.note strong{color:var(--ink)}
.note.live{border-left-color:var(--lime-ink)}
.note.err{border-left-color:var(--crit)}
.note a,.note button.link{color:var(--accent);font-weight:600;text-decoration:none;background:none;border:none;padding:0;font-size:inherit}
.note a:hover,.note button.link:hover{text-decoration:underline}

/* ---- kpi ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;position:relative;overflow:hidden}
.kpi .eyebrow{margin-bottom:8px}
.kpi .big{font-family:"Montserrat",system-ui,sans-serif;font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1}
.kpi .sub{font-size:11.5px;color:var(--muted);margin-top:5px}
.kpi.hero{background:linear-gradient(150deg,var(--accent-bg),var(--surface))}
.kpi.hero .big{color:var(--accent-ink)}
.kpi.alert .big{color:var(--crit)}
.meter{display:flex;height:7px;border-radius:20px;overflow:hidden;margin-top:11px;background:var(--panel);gap:2px}
.meter span{height:100%}

/* ---- funnel strip ---- */
.funnel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 15px 10px;margin-bottom:14px}
.funnel .fh{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.funnel .fh h2{font-size:13px;font-weight:700}
.funnel .fh .eyebrow{margin-left:auto}
.frow{display:grid;grid-template-columns:150px 1fr 66px 90px;gap:10px;align-items:center;padding:3px 0;font-size:12px}
.frow .lbl{display:flex;align-items:center;gap:7px;color:var(--ink-2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .bar{height:12px;background:var(--panel);border-radius:4px;position:relative;overflow:hidden}
.frow .bar span{position:absolute;inset:0 auto 0 0;border-radius:0 4px 4px 0;min-width:2px}
.frow .n{color:var(--ink-2);text-align:right}
.frow .v{color:var(--gold);font-weight:600;text-align:right}
.frow.zero .lbl,.frow.zero .n,.frow.zero .v{color:var(--muted);font-weight:400}
.conv{font-size:11px;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 14px}
.conv b{color:var(--ink-2);font-family:"IBM Plex Mono",monospace;font-weight:600}

/* ---- filters ---- */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select{padding:7px 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);font-size:12.5px;font-family:inherit;max-width:200px}
.chip{border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-2);padding:6px 11px;border-radius:20px;font-size:12px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--accent-bg);color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.chip.alerta.on{background:var(--crit-bg);color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,transparent)}
.chip.q[data-q="GO"].on{background:var(--go-bg);color:var(--go);border-color:color-mix(in srgb,var(--go) 40%,transparent)}
.chip.q[data-q="EXPLORE"].on{background:var(--explore-bg);color:var(--explore);border-color:color-mix(in srgb,var(--explore) 40%,transparent)}
.chip.kycok.on{background:var(--ok-bg);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.filters .clear{margin-left:auto;color:var(--muted);background:none;border:none;font-size:12px;font-weight:600;text-decoration:underline}
.count-line{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.count-line b{color:var(--ink);font-weight:700}

/* ---- board ---- */
.board{display:flex;gap:13px;overflow-x:auto;padding-bottom:14px;scroll-snap-type:x proximity}
.col{flex:0 0 284px;background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;max-height:74vh;scroll-snap-align:start}
.col.dragover{outline:2px dashed var(--accent);outline-offset:-3px;background:var(--accent-bg)}
.col-head{padding:11px 13px 9px;border-bottom:1px solid var(--line);position:sticky;top:0}
.col-head .top{display:flex;align-items:center;gap:8px}
.col-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.col-head h3{font-size:12.5px;font-weight:700;letter-spacing:.01em;flex:1}
.col-head .n{font-family:"IBM Plex Mono";font-size:12px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border-radius:20px;padding:1px 8px;border:1px solid var(--line)}
.col-head .val{font-family:"IBM Plex Mono";font-size:11px;color:var(--gold);margin-top:5px;font-weight:600;display:flex;gap:10px}
.col-head .val .p{color:var(--muted);font-weight:500}
.col-body{overflow-y:auto;padding:9px;display:flex;flex-direction:column;gap:8px;flex:1}
.col-body:empty::after{content:"Sin oportunidades";color:var(--muted);font-size:12px;text-align:center;padding:18px 0;font-style:italic}

.card{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--stage,var(--muted));border-radius:9px;padding:10px 11px;cursor:grab;box-shadow:var(--shadow);transition:transform .08s,box-shadow .12s;position:relative}
.card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.card:active{cursor:grabbing}
.card.dragging{opacity:.4}
.card .r1{display:flex;align-items:flex-start;gap:8px}
.card h4{margin:0;font-size:13px;font-weight:700;line-height:1.25;flex:1;letter-spacing:-.01em}
.card .prov{font-size:11.5px;color:var(--ink-2);margin-top:2px}
.card .meta{display:flex;flex-wrap:wrap;gap:5px 9px;margin-top:7px;font-size:11px;color:var(--ink-2);align-items:center}
.card .amt{font-family:"IBM Plex Mono";font-weight:600;color:var(--gold)}
.card .prob{font-family:"IBM Plex Mono";color:var(--muted)}
.pill{font-size:9.5px;font-weight:800;letter-spacing:.05em;padding:2px 6px;border-radius:5px;flex:0 0 auto;text-transform:uppercase}
.pill.veh{background:var(--accent-bg);color:var(--accent-ink)}
.pill.demo{background:var(--explore-bg);color:var(--explore)}
.pill.kyc-verde{background:var(--ok-bg);color:var(--ok)} .pill.kyc-en_proceso{background:var(--warn-bg);color:var(--warn)}
.pill.kyc-pendiente{background:var(--panel);color:var(--muted)} .pill.kyc-rojo{background:var(--crit-bg);color:var(--crit)}
.pill.GO{background:var(--go-bg);color:var(--go)} .pill.EXPLORE{background:var(--explore-bg);color:var(--explore)} .pill.DROP{background:var(--drop-bg);color:var(--drop)}
.card .next{margin-top:7px;font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:baseline}
.card .next b{color:var(--ink-2);font-weight:600}
.card .next.late b{color:var(--crit)}
.alerts{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.al{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;display:inline-flex;gap:4px;align-items:center;letter-spacing:.02em}
.al.crit{background:var(--crit-bg);color:var(--crit)} .al.warn{background:var(--warn-bg);color:var(--warn)}
.card.changed{box-shadow:inset 0 0 0 1.5px var(--accent),var(--shadow)}
.card .dirty{position:absolute;top:7px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--accent);display:none}
.card.changed .dirty{display:block}

/* ---- table ---- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:980px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;font-weight:700;z-index:5}
th:hover{color:var(--ink)}
tbody tr:hover{background:var(--accent-bg)}
tbody tr{cursor:pointer}
td.name{font-weight:600;white-space:normal;max-width:300px}
td .amt{font-family:"IBM Plex Mono";color:var(--gold);font-weight:600}
td.num,th.num{text-align:right}
.stage-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600}
.stage-pill .col-dot{width:8px;height:8px}
.empty{padding:40px 20px;text-align:center;color:var(--muted);white-space:normal}

/* ---- lunes ---- */
.lunes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lunes .panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.lunes .panel h2{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:baseline;gap:8px}
.lunes .panel h2 .eyebrow{margin-left:auto}
.lunes .wide{grid-column:1/-1}
.top3{display:flex;flex-direction:column;gap:8px}
.top3 .it{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:start;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);cursor:pointer}
.top3 .it:hover{border-color:var(--accent)}
.top3 .rank{font-family:"Montserrat";font-weight:800;font-size:16px;color:var(--accent)}
.top3 .t{font-weight:700;font-size:13px}
.top3 .s{font-size:12px;color:var(--ink-2)}
.top3 .s b{color:var(--ink)}
.top3 .m{font-family:"IBM Plex Mono";font-size:12px;color:var(--gold);font-weight:600;text-align:right;white-space:nowrap}
.allist{display:flex;flex-direction:column;gap:6px}
.allist .it{display:flex;gap:10px;align-items:baseline;font-size:12.5px;padding:7px 10px;border-radius:8px;background:var(--panel);cursor:pointer}
.allist .it:hover{outline:1px solid var(--accent)}
.allist .who{font-weight:700;flex:0 0 auto}
.allist .why{color:var(--ink-2)}
.summary{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:13px}
.summary div{display:flex;flex-direction:column}
.summary .eyebrow{margin-bottom:2px}
.summary .v{font-family:"IBM Plex Mono";font-weight:600;font-size:16px}
.summary .v.acc{color:var(--accent-ink)}
.vtab{width:100%;min-width:0;font-size:12.5px}
.vtab th{position:static}
@media (max-width:900px){.lunes{grid-template-columns:1fr}}

/* ---- drawer ---- */
.scrim{position:fixed;inset:0;background:rgba(10,12,11,.42);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(480px,94vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .24s cubic-bezier(.4,0,.2,1);z-index:61;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dh h2{font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.2;flex:1}
.db{overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field>label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;font-family:"IBM Plex Mono"}
.field select,.field textarea,.field input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);font-family:inherit;font-size:13px}
.field textarea{resize:vertical;min-height:64px;line-height:1.5}
.field input.mono{font-family:"IBM Plex Mono"}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:12.5px;margin:0}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;color:var(--ink)}
.kv dd a{color:var(--accent);text-decoration:none;font-weight:600}
.box{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px 12px;font-size:12.5px;line-height:1.55}
.box .eyebrow{margin-bottom:6px}
.hist{display:flex;flex-direction:column;gap:6px;font-size:12px}
.hist .h{display:grid;grid-template-columns:78px 1fr;gap:8px}
.hist .d{color:var(--muted);font-family:"IBM Plex Mono";font-size:11px}
.df{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:9px;align-items:center;background:var(--surface)}
.btn{padding:9px 15px;border-radius:8px;border:none;font-weight:700;font-size:13px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:disabled{opacity:.45;cursor:default}
.btn.subtle{background:var(--panel);color:var(--ink-2);border:1px solid var(--line)}
.saved-flash{color:var(--go);font-size:12px;font-weight:600;opacity:0;transition:opacity .2s;margin-left:auto}
.saved-flash.on{opacity:1}

const LS_KEY="kabal_liq_pipeline_v1";
let raw = (SNAPSHOT.oportunidades.length||SNAPSHOT.proveedores.length) ? SNAPSHOT : demoData();

try{ const o=JSON.parse(localStorage.getItem(LS_KEY)); if(o&&o.opp) overrides=Object.assign({opp:{},prov:{},nuevos:[]},o); }catch(e){}
function persist(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(overrides)); }catch(e){} }

let provs=[], opps=[], byOpp={}, byProv={};
function build(){
  const P = raw.proveedores.concat(overrides.nuevos.filter(n=>n.kind==="prov").map(n=>n.rec));
  const O = raw.oportunidades.concat(overrides.nuevos.filter(n=>n.kind==="opp").map(n=>n.rec));
  byProv={}; provs=P.map(p=>{const o=overrides.prov[p.id]||{}; const m=Object.assign({},p,o); m._changed=!!Object.keys(o).length||String(p.id).startsWith("new-"); m._demo=!!raw.demo; byProv[m.id]=m; return m;});
  byOpp={}; opps=O.map(x=>{const o=overrides.opp[x.id]||{}; const m=Object.assign({},x,o); m._changed=!!Object.keys(o).length||String(x.id).startsWith("new-"); m._demo=!!raw.demo; byOpp[m.id]=m; return m;});
  enrich();
}
const now=()=>new Date();
const days=(a,b)=>Math.round(((b||now())-new Date(a))/864e5*10)/10;
function enrich(){
  const today=now().toISOString().slice(0,10);
  opps.forEach(o=>{
    const p=byProv[o.proveedor_id]||{};
    o._prov=p;
    const st=(o.etapa!==(overrides.opp[o.id]||{}).etapa)?o.etapa_desde:(overrides.opp[o.id]._etapa_desde||now().toISOString());
    o._dias=Math.max(0,days(st||o.created_at||now().toISOString()));
    const inter=raw.interacciones.filter(i=>i.oportunidad_id===o.id||(!i.oportunidad_id&&i.proveedor_id===o.proveedor_id));
    o._ultima=inter.length?inter.map(i=>i.fecha).sort().slice(-1)[0]:null;
    o._sinContacto=Math.max(0,days(o._ultima||o.created_at||now().toISOString()));
    o._wired=raw.desembolsos.filter(d=>d.oportunidad_id===o.id&&d.verificado).reduce((s,d)=>s+(+d.monto_usd||0),0);
    o._pond=Math.round((+o.monto_objetivo_usd||0)*(+o.probabilidad_pct||0)/100);
    const a=[];
    const live=ACTIVE.includes(o.etapa)&&o.etapa!=="wired";
    if(live&&(!o.proximo_paso||!o.fecha_proximo_paso)) a.push({k:"paso",t:"Sin próximo paso",c:"warn",w:25});
    if(live&&o.fecha_proximo_paso&&o.fecha_proximo_paso<today) a.push({k:"vencido",t:"Paso vencido",c:"crit",w:30});
    if(o.etapa==="compromiso_verbal"&&o.fecha_compromiso_verbal&&days(o.fecha_compromiso_verbal)>SLA.DEGRADAR) a.push({k:"degradar",t:"Verbal >14d · degradar",c:"crit",w:40});
    if(["due_diligence","compromiso_verbal","firmado"].includes(o.etapa)&&p.kyc_estado!=="verde") a.push({k:"kyc",t:"KYC no verde",c:"crit",w:35});
    if(live&&SLA.MAX[o.etapa]&&o._dias>SLA.MAX[o.etapa]) a.push({k:"estancado",t:"Estancada "+Math.round(o._dias)+"d",c:"warn",w:15});
    if(live&&o._sinContacto>SLA.FRIO) a.push({k:"frio",t:"Fría "+Math.round(o._sinContacto)+"d",c:"warn",w:10});
    o._alertas=a;
    let score=a.reduce((s,x)=>s+x.w,0)+Math.log10(o._pond+1)*10;
    if(o.fecha_cierre_esperada){const dd=days(now().toISOString().slice(0,10),new Date(o.fecha_cierre_esperada)); if(dd<=14)score+=15; else if(dd<=30)score+=8;}
    o._score=Math.round(score);
  });
}
function setOpp(id,patch){
  const base=raw.oportunidades.find(x=>x.id===id)||(overrides.nuevos.find(n=>n.rec.id===id)||{}).rec||{};
  const cur=overrides.opp[id]||{}; const next=Object.assign({},cur,patch);
  if("etapa" in patch && patch.etapa!==cur.etapa){ next._etapa_desde=now().toISOString(); if(patch.etapa!==base.etapa){ if(!("probabilidad_pct" in patch)) next.probabilidad_pct=STAGE[patch.etapa].prob; } }
  for(const k of Object.keys(next)){ if(k[0]==="_") continue; if(next[k]===base[k]||(next[k]===""&&(base[k]==null||base[k]===""))||(next[k]==null&&base[k]==null)) delete next[k]; }
  if(Object.keys(next).filter(k=>k[0]!=="_").length) overrides.opp[id]=next; else delete overrides.opp[id];
  persist(); build();
}
function setProv(id,patch){
  const base=raw.proveedores.find(x=>x.id===id)||(overrides.nuevos.find(n=>n.rec.id===id)||{}).rec||{};
  const cur=overrides.prov[id]||{}; const next=Object.assign({},cur,patch);
  for(const k of Object.keys(next)){ if(next[k]===base[k]||(next[k]===""&&(base[k]==null||base[k]===""))) delete next[k]; }
  if(Object.keys(next).length) overrides.prov[id]=next; else delete overrides.prov[id];
  persist(); build();
}

   SINCRONIZAR (SQL / CSV / aplicar en vivo)
   ===================================================================== */
const sq=s=>"'"+String(s).replace(/'/g,"''")+"'";
const lit=v=>v==null||v===""?"null":(typeof v==="number"?String(v):sq(v));
function buildSQL(){
  const L=["-- Pipeline de Liquidez · aplicar en Supabase (tablas liq_*)","begin;"];
  overrides.nuevos.filter(n=>n.kind==="prov").forEach(({rec:p})=>L.push(`insert into liq_proveedores (nombre,tipo,pais,decisor,vehiculos,fuente) values (${sq(p.nombre)},${sq(p.tipo)},${lit(p.pais)},${lit(p.decisor)},'{${(p.vehiculos||[]).join(",")}}','tablero') on conflict (nombre) do nothing;`));
  overrides.nuevos.filter(n=>n.kind==="opp").forEach(({rec:o})=>{
    const pn=(byProv[o.proveedor_id]||{}).nombre; const pref=String(o.proveedor_id).startsWith("new-")?`(select id from liq_proveedores where nombre=${sq(pn)})`:sq(o.proveedor_id);
    const ov=overrides.opp[o.id]||{}; const m=Object.assign({},o,ov);
    L.push(`insert into liq_oportunidades (proveedor_id,nombre,vehiculo,monto_objetivo_usd,monto_comprometido_usd,etapa,probabilidad_pct,owner,proximo_paso,fecha_proximo_paso,fecha_cierre_esperada,motivo_perdida,notas) values (${pref},${sq(m.nombre)},${sq(m.vehiculo)},${m.monto_objetivo_usd},${m.monto_comprometido_usd||0},${sq(m.etapa)},${m.probabilidad_pct},${lit(m.owner)},${lit(m.proximo_paso)},${lit(m.fecha_proximo_paso)},${lit(m.fecha_cierre_esperada)},${lit(m.motivo_perdida)},${lit(m.notas)});`);
  });
  Object.entries(overrides.prov).forEach(([id,o])=>{ if(String(id).startsWith("new-")) return; const sets=Object.entries(o).map(([k,v])=>`${k}=${lit(v)}`); if(sets.length) L.push(`update liq_proveedores set ${sets.join(", ")} where id=${sq(id)}; -- ${(byProv[id]||{}).nombre||""}`); });
  Object.entries(overrides.opp).forEach(([id,o])=>{ if(String(id).startsWith("new-")) return; const name=(byOpp[id]||{}).nombre||"";
    if("etapa" in o) L.push(`select liq_mover_etapa(${sq(id)}, ${sq(o.etapa)}, ${lit(o.motivo_perdida)}, ${lit(o.proximo_paso)}, ${lit(o.fecha_proximo_paso)}, ${"monto_comprometido_usd" in o?o.monto_comprometido_usd:"null"}); -- ${name}`);
    const rest=Object.entries(o).filter(([k])=>k[0]!=="_"&&!(("etapa" in o)&&["etapa","motivo_perdida","proximo_paso","fecha_proximo_paso","monto_comprometido_usd"].includes(k)));
    if(rest.length) L.push(`update liq_oportunidades set ${rest.map(([k,v])=>`${k}=${lit(v)}`).join(", ")} where id=${sq(id)}; -- ${name}`); });
  overrides.nuevos.filter(n=>n.kind==="inter").forEach(({rec:i})=>{ if(String(i.oportunidad_id).startsWith("new-")) return; L.push(`insert into liq_interacciones (proveedor_id,oportunidad_id,tipo,resumen,creado_por) values (${sq(i.proveedor_id)},${sq(i.oportunidad_id)},'nota',${sq(i.resumen)},'tablero');`); });
  L.push("commit;");
  return L.length>3?L.join("\n"):"-- No hay cambios pendientes.";
}
function buildCSV(){
  const head=["oportunidad","proveedor","vehiculo","etapa","monto_objetivo_usd","probabilidad_pct","proximo_paso","fecha_proximo_paso","alertas"];
  const q=v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`;
  return head.join(",")+"\n"+opps.map(o=>[o.nombre,(o._prov||{}).nombre,o.vehiculo,o.etapa,o.monto_objetivo_usd,o.probabilidad_pct,o.proximo_paso,o.fecha_proximo_paso,o._alertas.map(a=>a.t).join(" | ")].map(q).join(",")).join("\n");
}

  modal.classList.add("open");

let mcpNs=null, liveAt=null;
function parsePayload(payload){
  let txt=payload;
  if(payload&&typeof payload==="object"&&!Array.isArray(payload)){ if(Array.isArray(payload.result)) return payload.result; if(typeof payload.result==="string") txt=payload.result; else if(payload.content&&payload.content[0]&&payload.content[0].text) txt=payload.content[0].text; else return payload; }
  if(Array.isArray(txt)) return txt;
  if(typeof txt!=="string") return txt;
  const m=txt.match(/<untrusted-data-[^>]*>\s*([\s\S]*?)\s*<\/untrusted-data-[^>]*>/);
  const body=m?m[1]:txt.trim();
  try{ return JSON.parse(body); }catch(e){ const i=body.indexOf("["); if(i>=0){ try{ return JSON.parse(body.slice(i)); }catch(e2){} } throw new Error("Respuesta de Supabase no reconocida"); }
}
async function sbQuery(sql){
  if(!mcpNs) throw new Error("Sin conector");
  const res=await mcpNs.callTool(SB.server,SB.tool,{project_id:SB.project,query:sql},{cache:false});
  return parsePayload(res.payload!==undefined?res.payload:res);
}
const LOAD_SQL=`select json_build_object('proveedores',(select coalesce(json_agg(p),'[]'::json) from liq_proveedores p),'oportunidades',(select coalesce(json_agg(o),'[]'::json) from liq_oportunidades o),'interacciones',(select coalesce(json_agg(i),'[]'::json) from (select * from liq_interacciones order by fecha desc limit 500) i),'desembolsos',(select coalesce(json_agg(d),'[]'::json) from liq_desembolsos d)) as data`;
function setSource(kind,msg){
  const s=$("#src"); s.classList.toggle("live",kind==="live");
  $("#src-txt").textContent= kind==="live"?"en vivo · Supabase":kind==="demo"?"ejemplos":"snapshot "+fdate(SNAPSHOT.tomado);
  const n=$("#note");
  if(kind==="demo") n.innerHTML=`<div class="note"><strong>Datos de ejemplo.</strong> El CRM de liquidez todavía no tiene proveedores cargados. Lo que ves son nombres ficticios para mostrar cómo funciona el tablero. Agregá la primera oportunidad con <b>+ Nueva</b>${mcpNs?"":" o pedile a Claude que cargue tus proveedores"}; al sincronizar, los ejemplos desaparecen.</div>`;
  else if(kind==="live") n.innerHTML=`<div class="note live"><strong>Conectado a Supabase.</strong> Leyendo las tablas liq_* con tu conector${liveAt?` · actualizado ${liveAt.toLocaleTimeString("es")}`:""}. <button class="link" id="reload-btn">Actualizar</button></div>`;
  else if(kind==="snapshot"&&!opps.length&&provs.length) n.innerHTML=`<div class="note live"><strong>Directorio cargado.</strong> ${provs.length} instituciones en <b>Proveedores</b> (${provs.filter(p=>p.calificacion==="GO").length} GO), todavía ninguna con oportunidad en el funnel. Abrí la ficha de una institución y usá <b>+ Oportunidad</b> para ponerla en «Identificado» con vehículo y monto.</div>`;
  else if(kind==="error") n.innerHTML=`<div class="note err"><strong>Sin conexión en vivo.</strong> ${esc(msg||"")} Mostrando ${raw.demo?"ejemplos":"el snapshot"}.</div>`;
  else n.innerHTML="";
  const rb=$("#reload-btn"); if(rb) rb.onclick=()=>liveLoad(true);
}
async function liveLoad(force){
  if(!mcpNs) return;
  try{
    const rows=await sbQuery(LOAD_SQL);
    const data=Array.isArray(rows)?(rows[0]||{}).data:(rows&&rows.data);
    if(!data||!Array.isArray(data.proveedores)) throw new Error("Formato inesperado");
    liveAt=new Date();
    if(data.proveedores.length||data.oportunidades.length||force){ raw=Object.assign({demo:false},data); source="live"; setSource("live"); if(!data.oportunidades.length&&data.proveedores.length) $("#note").insertAdjacentHTML("beforeend",`<div class="note"><strong>Directorio: ${data.proveedores.length} instituciones, 0 oportunidades.</strong> Abrí una ficha en Proveedores y usá <b>+ Oportunidad</b>.</div>`); }
    else { raw=demoData(); source="demo"; setSource("demo"); $("#src-txt").textContent="en vivo · sin datos aún"; $("#src").classList.add("live"); }
    // descartar overrides que ya están aplicados
    Object.keys(overrides.opp).forEach(id=>{ const b=raw.oportunidades.find(x=>x.id===id); if(!b) return; const o=overrides.opp[id]; Object.keys(o).forEach(k=>{ if(k[0]!=="_"&&String(b[k]==null?"":b[k])===String(o[k]==null?"":o[k])) delete o[k]; }); if(!Object.keys(o).filter(k=>k[0]!=="_").length) delete overrides.opp[id]; });
    persist(); build(); fillFilters(); refresh();
  }catch(e){
    const code=e&&e.code; let msg="";
    if(code==="needs_reauth") msg="Reconectá Supabase en claude.ai → Ajustes → Conectores.";
    else if(code==="server_not_connected"||code==="selection_required") msg="Agregá o elegí el conector Supabase en claude.ai → Ajustes → Conectores.";
    else if(code==="not_granted"||code==="blocked_by_policy"||code==="approval_required") msg="Este visor no permitió usar el conector.";
    else msg=(e&&e.message)||String(e);
    setSource("error",msg);
  }
}
